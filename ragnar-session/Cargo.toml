[package]
name = "ragnar-session"
version = "0.1.0"
authors = ["Jörg Schröder", "LieraOS Project <projekt@lieraos.local>"]
edition = "2021"
description = "Ragnar session manager (Rust port of the gnome-session fork)"
license = "GPL-3.0-or-later"

[dependencies]
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"

[package.metadata.deb]
maintainer = "Jörg Schröder <projekt@lieraos.local>"
section = "x11"
priority = "optional"
assets = [
    ["target/release/ragnar-session", "usr/libexec/ragnar-session", "755"],
    ["target/release/ragnar-session-quit", "usr/bin/ragnar-session-quit", "755"],
    ["target/release/ragnar-session-inhibit", "usr/bin/ragnar-session-inhibit", "755"],
    ["target/release/ragnar-session-compositor-ready", "usr/libexec/ragnar-session-compositor-ready", "755"],
    ["data/ragnar-session", "usr/bin/ragnar-session", "755"],
    ["data/ragnar-session.target", "usr/lib/systemd/user/ragnar-session.target", "644"],
    ["data/org.lieraos.ragnar.SessionManager.gschema.xml", "usr/share/glib-2.0/schemas/", "644"],
]
