# Skald: keep voice-chat apps from hijacking the source volume.
# Discord/Chromium-based apps rewrite channelVolumes via their AGC —
# on the virtual mic that shows up as random wandering in the GUI.
# With this quirk their pulse volume writes are blocked; the app can
# still process audio internally, it just cannot own the source.
pulse.rules = [
  {
    matches = [
      { application.process.binary = "~.*[Dd]iscord.*" }
      { application.process.binary = "~.*vesktop.*" }
      { application.name = "~.*[Dd]iscord.*" }
    ]
    actions = {
      quirks = [ block-source-volume ]
    }
  }
]
