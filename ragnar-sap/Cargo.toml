[package]
name = "ragnar-sap"
version = "0.1.8"
authors = ["Jörg Schröder", "LieraOS Project <projekt@lieraos.local>"]
edition = "2021"
description = "Ragnar SAP — scan and print workflows for the Ragnar desktop, GTK4"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
libc = "0.2"
lopdf = "0.32"
miniz_oxide = "0.8"
lettre = "0.11"
image = "0.25"
pangocairo = "0.20"

[package.metadata.deb]
maintainer = "Jörg Schröder <projekt@lieraos.local>"
section = "graphics"
priority = "optional"
depends = "$auto, libsane1, sane-utils, cups"
recommends = "cups-filters, ghostscript, tesseract-ocr, poppler-utils, pdftk-java"
suggests = "brscan3 | brscan4 | brscan5"
maintainer-scripts = "debian"
assets = [
    ["target/release/ragnar-sap", "usr/bin/ragnar-sap", "755"],
    ["data/org.lieraos.ragnar.Sap.desktop", "usr/share/applications/", "644"],
    ["data/60-ragnar-sap-brother.rules", "usr/lib/udev/rules.d/", "644"],
    ["target/locale/en/LC_MESSAGES/ragnar-sap.mo", "usr/share/locale/en/LC_MESSAGES/ragnar-sap.mo", "644"],
]
