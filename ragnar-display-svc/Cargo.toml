[package]
name = "ragnar-display-svc"
version = "0.1.0"
edition = "2021"
description = "Display and output management service for the Ragnar desktop (Liera)"
license = "GPL-3.0-or-later"
authors = ["LieraOS Project <projekt@lieraos.local>"]

[dependencies]
ragnar-shared = { path = "../ragnar-shared" }
zbus = { version = "5", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[package.metadata.deb]
maintainer = "LieraOS Project <projekt@lieraos.local>"
section = "x11"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/ragnar-display-svc", "usr/bin/ragnar-display-svc", "755"],
    ["data/org.lieraos.ragnar.DisplayServices.desktop", "etc/xdg/autostart/", "644"],
]
