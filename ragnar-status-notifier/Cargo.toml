[package]
name = "ragnar-status-notifier"
version = "0.1.1"
edition = "2021"
description = "StatusNotifierWatcher service for the Ragnar desktop (Liera)"
license = "GPL-3.0-or-later"

[dependencies]
# gio/glib only: session-bus watcher — headless daemon; tray hosts
# (ragnar-taskbar, raven) subscribe to its signals.
gio = "0.20"
glib = "0.20"

[package.metadata.deb]
maintainer = "LieraOS Project <projekt@lieraos.local>"
section = "x11"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/ragnar-status-notifier", "usr/bin/ragnar-status-notifier", "755"],
    ["data/org.lieraos.ragnar.StatusNotifier.desktop", "etc/xdg/autostart/", "644"],
]
