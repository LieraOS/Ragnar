# ragnar-greeter — animated LightDM greeter for the Ragnar desktop
[package]
name = "ragnar-greeter"
version = "0.1.0"
edition = "2021"
description = "Animated LightDM greeter for the Ragnar desktop (Liera)"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_14"] }
libc = "0.2"
gettext-rs = { version = "0.7", features = ["gettext-system"] }

[package.metadata.deb]
maintainer = "Jörg Schröder <projekt@lieraos.local>"
section = "x11"
priority = "optional"
depends = "$auto, liblightdm-gobject-1-0 (>= 1.26), lightdm (>= 1.26)"
assets = [
    ["target/release/ragnar-greeter", "usr/bin/ragnar-greeter", "755"],
    ["data/artwork/*", "usr/share/ragnar-greeter/artwork/", "644"],
    ["target/locale/en/LC_MESSAGES/ragnar-greeter.mo", "usr/share/locale/en/LC_MESSAGES/", "644"],
    ["data/ragnar-greeter.desktop", "usr/share/xgreeters/", "644"],
    ["debian/50-ragnar-greeter.conf", "etc/lightdm/lightdm.conf.d/", "644"],
]
