# lightdm drop-in — selects ragnar-greeter as the greeter session.
# Ships in the ragnar-greeter package; the name sorts after the
# live-build's 01-autologin.conf so it wins on installed systems.
# On the live ISO autologin skips the greeter entirely, so this
# is a no-op there.

[Seat:*]
greeter-session=ragnar-greeter
