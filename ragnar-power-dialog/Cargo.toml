[package]
name = "ragnar-power-dialog"
version = "0.1.4"
authors = ["Jörg Schröder", "LieraOS Project <projekt@lieraos.local>"]
edition = "2021"
description = "Session power dialog for the Ragnar desktop (Liera)"
license = "GPL-3.0-or-later"

[dependencies]
# GUI framework: GTK4 + libadwaita, matching ragnar-settings
gtk4 = { version = "0.9", features = ["v4_10"] }
libadwaita = { version = "0.7", features = ["v1_7"] }

# Localization (gettext; msgids are German, po/en.po for English)
gettext-rs = { version = "0.7", features = ["gettext-system"] }

# Platform paths (~/.config for the user CSS override)
dirs = "5.0"

[package.metadata.deb]
maintainer = "Jörg Schröder <projekt@lieraos.local>"
section = "x11"
priority = "optional"
# ragnar-session ships ragnar-session-quit (logout/reboot/power-off),
# gsettings schema needs libglib2.0-bin for the postinst compile.
depends = "$auto, ragnar-session, systemd, libglib2.0-bin"
assets = [
    ["target/release/ragnar-power-dialog", "usr/bin/ragnar-power-dialog", "755"],
    ["data/org.lieraos.ragnar.session.gschema.xml", "usr/share/glib-2.0/schemas/", "644"],
    ["data/power-dialog.css", "usr/share/ragnar-power-dialog/", "644"],
    ["target/locale/en/LC_MESSAGES/ragnar-power-dialog.mo", "usr/share/locale/en/LC_MESSAGES/ragnar-power-dialog.mo", "644"],
]
maintainer-scripts = "packaging/debian/"
