[package]
name = "ragnar-raven"
version = "0.1.0"
edition = "2021"
description = "Ragnar sidebar: calendar, appointments and notification history (Rust/GTK4)"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.5"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
